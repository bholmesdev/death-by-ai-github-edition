name: Response
description: Submit your survival plan.
title: "Response: "
labels: ["game:response"]
body:
  - type: input
    id: scenario
    attributes:
      label: Scenario
      description: The scenario issue this response answers.
      placeholder: "#N"
    validations:
      required: true
  - type: input
    id: github-username
    attributes:
      label: GitHub username
      description: Your GitHub handle. Used to show your name and avatar.
      placeholder: "octocat"
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: Survival plan
      placeholder: "I would..."
    validations:
      required: true
