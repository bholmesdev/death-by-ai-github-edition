name: Response
description: Submit your survival plan.
title: "Response: "
labels: ["game:response"]
body:
  # Keep this in one textarea so the created issue body preserves the exact
  # parseable `responds-to:` line.
  - type: textarea
    id: response
    attributes:
      label: Response
      value: |
        responds-to: #N

        My survival plan:
    validations:
      required: true
