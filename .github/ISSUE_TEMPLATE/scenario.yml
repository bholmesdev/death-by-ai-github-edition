name: Scenario
description: Submit a survival scenario for Death by AI.
title: "Scenario: "
labels: ["game:scenario"]
body:
  - type: textarea
    id: prompt
    attributes:
      label: Prompt
      description: A public-conference-safe survival setup.
      placeholder: "You're trapped in an elevator with..."
    validations:
      required: true
  - type: input
    id: github-username
    attributes:
      label: GitHub username
      description: Your GitHub handle. Used to credit your suggestion.
      placeholder: "octocat"
    validations:
      required: true
